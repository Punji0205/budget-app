<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF8F1">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root { --bg: #FFF8F1; --text: #4A3B33; --sub: #9C8B80; --accent: #F4845F; --line: #F3E7DD; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { position: fixed; inset: 0; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { display: block; width: 100%; height: 100%; border: 0; }
  #gate { display: none; height: 100%; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  #gate form { width: 100%; max-width: 360px; text-align: center; }
  #gate h1 { font-size: 22px; margin: 0 0 6px; }
  #gate p { color: var(--sub); font-size: 14px; margin: 0 0 18px; }
  #gate input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: #fff; margin-bottom: 10px; }
  #gate button { width: 100%; font-size: 16px; font-weight: 700; padding: 12px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; }
  #retry { display: none; position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 360px; box-sizing: border-box; background: #fff; border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,.12); padding: 14px 16px; text-align: center; font-size: 14px; color: var(--sub); }
  #retry button { margin-top: 10px; width: 100%; font-size: 16px; font-weight: 700; padding: 11px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; }
</style>
</head>
<body>
<iframe id="app" title="My Budget" allow="clipboard-write"></iframe>
<div id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>My Budget</h1>
    <p>처음 한 번만 접근 키를 넣어 주세요.</p>
    <input id="keyInput" type="password" placeholder="접근 키" required>
    <button type="submit">열기</button>
  </form>
</div>
<div id="retry">화면이 열리지 않나요? 접근 키가 틀렸을 수 있어요.<button type="button" id="retryBtn">접근 키 다시 입력</button></div>
<script>
  // 할 일 자료·키는 이 저장소에 없음. 키는 이 기기에만 저장된다.
  var EXEC = 'https://script.google.com/macros/s/AKfycbz4QdWsaSA4cd8oJgWUaNx9nCzBgVCzEck2NenRDK3zK_LEgS39YVSaRSG0O323zmeHRw/exec';
  var STORE = 'budget_app_key';
  function getStored() { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } }
  function setStored(k) { try { localStorage.setItem(STORE, k); } catch (e) {} }
  function fromHash() { var m = location.hash.match(/k=([A-Za-z0-9]+)/); return m ? m[1] : ''; }

  // 앱이 정상으로 열리면 신호(wrapperOk)를 보냄 → 10초 안에 없으면 '키 다시 입력' 안내
  var okTimer = null, opened = false;
  window.addEventListener('message', function (e) {
    if (e.data && e.data.wrapperOk) { opened = true; clearTimeout(okTimer); document.getElementById('retry').style.display = 'none'; }
  });
  function open(k) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('retry').style.display = 'none';
    var f = document.getElementById('app');
    f.style.display = 'block';
    opened = false;
    f.src = EXEC + '?k=' + encodeURIComponent(k);
    clearTimeout(okTimer);
    okTimer = setTimeout(function () { if (!opened) document.getElementById('retry').style.display = 'block'; }, 10000);
  }
  document.getElementById('retryBtn').addEventListener('click', function () {
    document.getElementById('retry').style.display = 'none';
    document.getElementById('keyInput').value = '';
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    showGate();
  });
  function showGate() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
  }

  var key = fromHash() || getStored();
  if (key) { setStored(key); open(key); } else { showGate(); }
  // 이미 열린 화면에서 키가 든 주소(#k=)를 다시 열어도 새 키로 바로 바꿈
  window.addEventListener('hashchange', function () { var k = fromHash(); if (k) { setStored(k); open(k); } });

  document.getElementById('gateForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var k = document.getElementById('keyInput').value.trim();
    if (!k) return;
    setStored(k);
    open(k);
  });
</script>
</body>
</html>

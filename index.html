<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF8F1">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root { --bg: #FFF8F1; --text: #4A3B33; --sub: #9C8B80; --accent: #F4845F; --line: #F3E7DD; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { position: fixed; inset: 0; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { display: block; width: 100%; height: 100%; border: 0; }
  #gate { display: none; height: 100%; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  #gate form { width: 100%; max-width: 360px; text-align: center; }
  #gate h1 { font-size: 22px; margin: 0 0 6px; }
  #gate p { color: var(--sub); font-size: 14px; margin: 0 0 18px; }
  #gate input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: #fff; margin-bottom: 10px; }
  #gate button { width: 100%; font-size: 16px; font-weight: 700; padding: 12px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; }
</style>
</head>
<body>
<iframe id="app" title="My Budget" allow="clipboard-write"></iframe>
<div id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>My Budget</h1>
    <p>처음 한 번만 접근 키를 넣어 주세요.</p>
    <input id="keyInput" type="password" placeholder="접근 키" required>
    <button type="submit">열기</button>
  </form>
</div>
<script>
  // 할 일 자료·키는 이 저장소에 없음. 키는 이 기기에만 저장된다.
  var EXEC = 'https://script.google.com/macros/s/AKfycbz4QdWsaSA4cd8oJgWUaNx9nCzBgVCzEck2NenRDK3zK_LEgS39YVSaRSG0O323zmeHRw/exec';
  var STORE = 'budget_app_key';
  function getStored() { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } }
  function setStored(k) { try { localStorage.setItem(STORE, k); } catch (e) {} }
  function fromHash() { var m = location.hash.match(/k=([A-Za-z0-9]+)/); return m ? m[1] : ''; }

  function open(k) {
    document.getElementById('gate').style.display = 'none';
    var f = document.getElementById('app');
    f.style.display = 'block';
    f.src = EXEC + '?k=' + encodeURIComponent(k);
  }
  function showGate() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
  }

  var key = fromHash() || getStored();
  if (key) { setStored(key); open(key); } else { showGate(); }

  document.getElementById('gateForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var k = document.getElementById('keyInput').value.trim();
    if (!k) return;
    setStored(k);
    open(k);
  });
</script>
</body>
</html>
